appId: com.appmeraung.kendurikita
---
- clearState
- launchApp
- assertVisible: "KenduriKita"
- assertVisible: "Skip"
- tapOn: "Skip"
- assertVisible: "Continue as guest"
- tapOn: "Continue as guest"
- assertVisible: "Step 1 of 6"
- tapOn: "English"
- tapOn: "Malay wedding"
- tapOn: "Continue"
- assertVisible: "Event or couple name"
- tapOn: "Couple's names or event name"
- inputText: "Aiman & Siti"
- hideKeyboard
- tapOn: "Continue"
- assertVisible: "Event date"
- tapOn: "Skip for now"
- assertVisible: "Venue"
- tapOn: "Skip for now"
- assertVisible: "Total budget & Estimated guests"
- tapOn: "Total budget"
- inputText: "25000"
- hideKeyboard
- tapOn: "Continue"
- assertVisible: "Invite your partner or family"
- tapOn: "Create event"
- assertVisible: "Enable reminders?"
- tapOn: "Not now"
- assertVisible: "Aiman & Siti"
- assertNotVisible: "Encik Rahman & keluarga"
- tapOn: "Budget"
- tapOn: "Add your first expense"
- tapOn: "Expense name"
- inputText: "Catering deposit"
- tapOn: "Planned amount"
- inputText: "10000"
- tapOn: "Amount paid"
- inputText: "2000"
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Catering deposit"
- assertVisible: "RM 15,000"
